<!DOCTYPE html>

<body class="mercadeo-page">

<!-- BANNER: same slot every other corner page's own nav sits in, just
     themed onyx/white/tangerine with the title's own bold display font. -->
<nav class="mercadeo-nav">
    <a href="/" class="mercadeo-nav-logo">
        <img src="Images/logo.PNG" alt="Santos Armada" class="mercadeo-nav-crest">
        <span>Santos Armada</span>
    </a>
    <button type="button" class="mercadeo-hamburger" onclick="toggleMenu()" aria-label="Toggle menu">☰</button>
    <ul class="mercadeo-nav-links" id="mercadeoNavLinks">
        <li><a href="essays.html">Essays</a></li>
        <li><a href="authors.html">Authors</a></li>
        <li><a href="globe.html">Space and Time</a></li>

        <li><a href="about.html">About</a></li>
    </ul>

<!-- TITLE STAGE: the letters are colored to match the onyx background
     (invisible on their own) — only their white text-shadow trail
     (see mercadeo.css) is visible, which is what reads as a solid
     extruded wordmark with a notched diagonal edge. No JS. -->
<div class="mercadeo-stage">
    <div class="mercadeo-title">
        <div class="mercadeo-line-1">EL</div>
        <div class="mercadeo-line-2">MERCADEO</div>
    </div>
</div>

<!-- PORTALS: the two entry points into El Mercadeo. Labels use the same
     bold display font and hard-offset tangerine hover as the nav/footer
     links, so the whole page shares one hover language. -->
<section class="mercadeo-portals">
    <div class="mercadeo-portals-grid">
        <a href="merch-store.html" class="mercadeo-portal-card">
            <div class="mercadeo-portal-image-wrap">
                <img src="Images/merch/cover_pages/merch-portal.png" alt="Merch webstore">
            </div>
            <span class="mercadeo-portal-label">Merch</span>
        </a>
        <a href="rentals.html" class="mercadeo-portal-card">
            <div class="mercadeo-portal-image-wrap">
                <img src="Images/merch/cover_pages/rentals-portal.png" alt="Alquileres / rentals">
            </div>
            <span class="mercadeo-portal-label">Alquileres</span>
        </a>
    </div>
</section>

<!-- FOOTER -->
<footer class="mercadeo-footer">
    <a href="/" class="mercadeo-footer-logo-link">
        <img src="Images/logo.PNG" alt="Santos Armada" class="mercadeo-footer-crest">

    <ul class="mercadeo-footer-links">

    </ul>
    <p class="mercadeo-footer-copy">© 2026 Santos Armada · santosarmada@protonmail.com · All rights reserved</p>
</footer>

<script>
    function toggleMenu() {
        document.getElementById('mercadeoNavLinks').classList.toggle('mercadeo-open');
    }
</script>
</body>
</html>
