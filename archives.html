<!-- ARCHIVES WORLD: full-bleed chrome/laser-red hero. Drag to orbit the

<script>
    function toggleMenu() {
        const nav = document.getElementById('nav-links');
        nav.classList.toggle('open');
    }

    // Laser sting on logo hover, in sync with the CSS beam-burst.
    // mouseenter (not mouseover) so it fires once per hover, not once
    // per child element the mouse crosses inside the logo link.
    (function () {
        const logo = document.querySelector('.nav-logo');
        const sound = document.getElementById('navLogoSound');
        if (!logo || !sound) return;

        // Browsers only allow audio playback after a real user gesture
        // (click/keydown/touch) — a hover doesn't count. Without this,
        // play() on the first hover of a fresh page load gets silently
        // rejected, which is exactly what read as "inconsistent": it
        // only worked once the visitor had already clicked/tapped
        // something else on the page first. Priming the element with a
        // muted play+pause on the first real gesture anywhere on the
        // page marks it as already "activated," so every hover after
        // that plays reliably.
        let unlocked = false;
        function unlock() {
            if (unlocked) return;
            unlocked = true;
            sound.muted = true;
            sound.play().then(() => {
                sound.pause();
                sound.currentTime = 0;
                sound.muted = false;
            }).catch(() => {
                sound.muted = false;
            });
        }
        document.addEventListener('pointerdown', unlock, { once: true });
        document.addEventListener('keydown', unlock, { once: true });

        logo.addEventListener('mouseenter', () => {
            sound.currentTime = 0;
            sound.play().catch(() => {});
        });
    })();
</script>
<script type="module" src="archives.js?v=8"></script>
