<section class="audiolibros-hero">
    <div id="enterPrompt">
  <a class="btn" id="enterBtn" href="#" title="tap to enter">
    tap to enter
    <span class="color color--black" data-value="1"></span>
    <span class="color color--white" data-value="1"></span>
  </a>
</div>
  <canvas id="growthCanvas"></canvas>
  <div id="flash"></div>

  <a id="forwardLink" href="Audiolibros/audiolibros-categories.html" aria-label="Ver categorías de audiolibros">
    <img
      id="finalLogo"
      src="Images/SAMesoAmerican.png"
      alt="Santos Armada Logo"
    >

    <div class="hero-label">audiolibros</div>
  </a>
  <audio id="transformSound" src="sounds/guitar-loop-arabic.wav" preload="auto"></audio>
  <a class="back-link" href="index.html">Mis oídos me duelen</a>
</section>

<style>
    #enterPrompt {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 0.3em;
  text-transform: lowercase;
  cursor: pointer;
  transition: opacity 0.4s ease;
}

.btn {
  position: relative;
  display: inline-block;
  font-family: Arial, sans-serif;
  color: #000;
  text-decoration: none;
  text-transform: lowercase;
  letter-spacing: 2.8px;
  background-color: #fff;
  border: 2px solid #000;
  padding: 15px 50px;
  border-radius: 5rem;
  box-shadow: 1px 2.9px 16px rgba(0, 0, 0, 0.25);
  transition: 0.6s cubic-bezier(0.01, 1.69, 0.99, 0.94);
  cursor: pointer;
}

.btn:hover {
  background-color: #6F98EC;
  color: #fff;
  border-color: #6F98EC;
  box-shadow: 3px 4.9px 16px rgba(0, 0, 0, 0.45);
  letter-spacing: 5px;
}

.btn--clicked {
  padding: 15px 2px;
  width: 50px;
  color: transparent;
  z-index: -10;
}

.color {
  display: block;
  width: 42em;
  height: 42em;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(0);
  position: absolute;
  transition: transform 0.8s ease;
  border-radius: 50%;
  background-color: transparent;
}

.expanded {
  transform: translate(-50%, -50%) scale(1);
}

.color--black {
  background-color: #000;
  transition-delay: 0.25s;
}

.color--white {
  background-color: #fff;
  transition-delay: 0.5s;
}

#enterPrompt.hide {
  opacity: 0;
  pointer-events: none;
}
    html, body {
  margin: 0;
  background: #fff;
}
  .audiolibros-hero {
    position: relative;
    width: 100vw;
    height: 100h;
    height: 100dvh;
    overflow: hidden;
    background: #fff;
  }

  #growthCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 1;
    transition: opacity 0.4s ease;
  }

  #growthCanvas.done {
    opacity: 0;
  }

  #finalLogo {
    position: absolute;
    left: 50%;
    top: calc(50% - 32px);
    width: min(78vw, 760px);
    transform: translate(-50%, -50%) scale(0.94);
    opacity: 0;
    filter: grayscale(1) contrast(1.45);
    transition:
      opacity 0.4s ease,
      transform 0.4s cubic-bezier(.2, .9, .3, 1);
    pointer-events: none;
  }

  #finalLogo.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
    cursor: pointer;
  }

  #flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  #flash.hit {
    animation: flashHit 0.22s ease-out forwards;
  }

  @keyframes flashHit {
    0% { opacity: 0; }
    30% { opacity: 0.5; }
    100% { opacity: 0; }
  }

  .hero-label {
    position: absolute;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    font-family: Arial, sans-serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 0.35em;
    text-transform: lowercase;
    color: #6F98EC;
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .hero-label.show {
    opacity: 0.8;
  }
  .back-link {
  position: absolute;
  left: 50%;
  bottom: 4%;
  transform: translateX(-50%);
  font-family: Arial, sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: lowercase;
  color: #000;
  text-decoration: none;
  opacity: 0;
  transition: opacity 0.35s ease, color 0.2s ease;
}

.back-link:hover,
.back-link:active {
  color: #6F98EC;
  text-decoration: underline;
}

.back-link.show {
  opacity: 0.6;
}

</style>

<script>
(function () {
  var can = document.getElementById("growthCanvas");
  var ctx = can.getContext("2d");

  var w;
  var h;

  function resize() {
    w = can.width = window.innerWidth;
    h = can.height = window.innerHeight;
  }

  resize();
  window.addEventListener("resize", resize);

  // ---------------------------------------------------------------
  // Logo silhouette
  //
  // A "radius per angle" profile of the logo's outline (a circle with
  // four compass-rose spikes), which the growth animation morphs the
  // organic blob into before crossfading into the real image.
  //
  // This used to be computed live on every page load via
  // ctx.getImageData() on an offscreen canvas. That read-back is slow
  // and, on Brave, actively intercepted/slowed down by its built-in
  // canvas fingerprinting protection (it "farbles" getImageData calls
  // by design). Since the logo doesn't change at runtime, the profile
  // is precomputed once offline and hardcoded here instead — same
  // shape, zero canvas read-back, and one less thing blocking the
  // animation on load in any browser.
  //
  // To regenerate after swapping the logo image, run analyzeSilhouetteOffline()
  // (defined below, unused by default) against the new image and paste
  // the resulting array back in here.
  // ---------------------------------------------------------------
  var SILHOUETTE_ANGLES = 96;
  var logoSilhouette = {
    n: SILHOUETTE_ANGLES,
    r: [140, 141, 145, 135, 134, 134, 133, 134, 133, 134, 133, 133, 133, 133, 133, 134, 134, 134, 134, 134, 135, 135, 134, 135, 155, 135, 135, 135, 135, 135, 135, 135, 135, 135, 135, 135, 135, 134, 134, 134, 134, 134, 134, 135, 136, 136, 146, 142, 142, 143, 145, 150, 138, 138, 139, 139, 140, 141, 141, 141, 142, 142, 143, 143, 143, 144, 144, 145, 145, 145, 145, 145, 159, 145, 145, 145, 145, 145, 144, 144, 143, 143, 142, 141, 140, 140, 140, 139, 139, 138, 138, 137, 137, 149, 144, 142]
  };

  // Dev utility only — not called at runtime. Kept for regenerating
  // logoSilhouette above if the logo artwork ever changes.
  function analyzeSilhouetteOffline(src, done) {
    var img = new Image();
    img.onload = function () {
      try {
        var WORK = 320;
        var off = document.createElement("canvas");
        off.width = WORK;
        off.height = WORK;
        var octx = off.getContext("2d");
        octx.clearRect(0, 0, WORK, WORK);
        octx.drawImage(img, 0, 0, WORK, WORK);
        var data = octx.getImageData(0, 0, WORK, WORK).data;

        var cx = WORK / 2;
        var cy = WORK / 2;
        var maxR = WORK * 0.5;

        function alphaAt(x, y) {
          x = Math.round(x);
          y = Math.round(y);
          if (x < 0 || y < 0 || x >= WORK || y >= WORK) return 0;
          return data[(y * WORK + x) * 4 + 3];
        }

        var radii = new Array(SILHOUETTE_ANGLES);
        for (var i = 0; i < SILHOUETTE_ANGLES; i++) {
          var ang = (i / SILHOUETTE_ANGLES) * Math.PI * 2;
          var dx = Math.cos(ang);
          var dy = Math.sin(ang);
          var lastInside = 0;
          for (var r = 0; r <= maxR; r += 1) {
            if (alphaAt(cx + dx * r, cy + dy * r) > 40) lastInside = r;
          }
          radii[i] = lastInside;
        }

        done({ r: radii, n: SILHOUETTE_ANGLES });
      } catch (e) {
        done(null);
      }
    };
    img.onerror = function () {
      done(null);
    };
    img.src = src;
  }

  function Point(x, y) {
    this.x = x || 0;
    this.y = y || 0;
    this.prev = null;
    this.next = null;
  }

  Point.prototype.sub = function (other) {
    this.x -= other.x;
    this.y -= other.y;
    return this;
  };

  Point.prototype.add = function (other) {
    this.x += other.x;
    this.y += other.y;
    return this;
  };

  Point.prototype.mul = function (scalar) {
    this.x *= scalar;
    this.y *= scalar;
    return this;
  };

  Point.prototype.normalize = function () {
    var length = Math.sqrt(this.x * this.x + this.y * this.y);
    if (length > 0) {
      this.x /= length;
      this.y /= length;
    }
    return this;
  };

  Point.prototype.distance = function (other) {
    var x = this.x - other.x;
    var y = this.y - other.y;
    return Math.sqrt(x * x + y * y);
  };

  Point.sub = function (a, b, out) {
    out = out || new Point();
    out.x = a.x - b.x;
    out.y = a.y - b.y;
    return out;
  };

  function Stick(a, b, length) {
    this.a = a;
    this.b = b;
    this.a.next = b;
    this.b.prev = a;
    this.dir = new Point();
    this.length = length || a.distance(b);
    this.active = true;
  }

  Stick.prototype.update = function (growthRate) {
    var dist = this.a.distance(this.b);

    if (dist > maxLength) {
      var np = new Point(
        (this.a.x + this.b.x) * 0.5,
        (this.a.y + this.b.y) * 0.5
      );

      points.push(np);
      sticks.push(new Stick(this.a, np));
      sticks.push(new Stick(np, this.b));

      this.active = false;
      return;
    }

    this.length *= growthRate;

    Point.sub(this.a, this.b, this.dir).normalize();

    var force = (dist - this.length) / (dist * 0.5);
    this.dir.mul(force + (Math.random() - 0.5));

    this.a.sub(this.dir);
    this.b.add(this.dir);
  };

  var growthRate = 1.018;
  var maxLength = 38;
  var minDist = 5 * maxLength;
  var maxIteration = 90;

  var points = [];
  var sticks = [];
  var dir = new Point();

  var total = 3;
  var step = Math.PI * 2 / total;
  var r = total * 3;

  for (var i = 0; i < total; i++) {
    points.push(new Point(
      Math.cos(i * step) * r,
      Math.sin(i * step) * r
    ));
  }

  for (i = 0; i < total; i++) {
    sticks.push(new Stick(points[i], points[(i + 1) % points.length]));
  }

  // ---------------------------------------------------------------
  // Beat sync
  //
  // Timestamps (seconds) of the rhythmic swells in
  // sounds/guitar-loop-arabic.wav, found by analyzing the clip's actual
  // waveform (RMS envelope, sustained-energy regions above the 75th
  // percentile). The clip is 4.324s long — the whole visual sequence is
  // now built to run that long too, so the blob pulses on each swell and
  // the morph into the logo lands on the final one.
  // ---------------------------------------------------------------
  var BEAT_TIMES = [0.69, 1.67, 2.19, 2.72]; // mid-sequence swells — pulse only
  var MORPH_START_TIME = 3.84;               // final, biggest swell — triggers the morph
  var HARD_CEILING_S = 4.2;                  // safety net if a device never reaches maxIteration
  var PULSE_HALF_WIDTH = 0.16;
  var PULSE_STRENGTH = 0.14;

  function pulseEnvelope(t) {
    var val = 0;
    var all = BEAT_TIMES.concat([MORPH_START_TIME]);
    for (var i = 0; i < all.length; i++) {
      var dt = Math.abs(t - all[i]);
      if (dt < PULSE_HALF_WIDTH) {
        var e = 1 - dt / PULSE_HALF_WIDTH;
        if (e > val) val = e;
      }
    }
    return val;
  }

  function drawBlobPolygon() {
    if (!sticks.length) return;
    var start = sticks[0].a;
    var origin = start;

    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.moveTo(origin.x, origin.y);

    while (origin.next && origin.next !== start) {
      origin = origin.next;
      ctx.lineTo(origin.x, origin.y);
    }

    ctx.closePath();
    ctx.fill();
  }

  var growthStartTime = null;

  function update(now) {
    if (growthStartTime === null) growthStartTime = now || performance.now();
    var elapsed = ((now || performance.now()) - growthStartTime) / 1000;

    minDist += maxLength * 0.12;

    var scale = 2000 / minDist;
    var minPointDist = (maxLength * 4) / scale;
    var pulse = 1 + PULSE_STRENGTH * pulseEnvelope(elapsed);

    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(scale * pulse, scale * pulse);

    // Plain nested-pair check. A spatial-hash version of this was tried,
    // but benchmarked ~4.7x slower than this at the point counts this
    // simulation actually reaches (~3-180) — the grid bookkeeping
    // (object allocation, string keys, hash lookups) costs more than it
    // saves at this scale. Keeping it simple.
    points.forEach(function (p, i) {
      for (var j = i + 1; j < points.length; j++) {
        var o = points[j];

        if (p === o) continue;

        var dist = p.distance(o);

        if (dist > minPointDist) continue;

        Point.sub(p, o, dir).normalize();

        var force = (dist - minDist) / (dist * points.length);
        dir.mul(force);

        p.sub(dir);
        o.add(dir);
      }
    });

    for (var k = sticks.length - 1; k >= 0; k--) {
      if (!sticks[k].active) {
        sticks.splice(k, 1);
      } else {
        sticks[k].update(growthRate);
      }
    }

    if (!sticks.length) return;

    drawBlobPolygon();
    ctx.restore();

    if (sticks.length < maxIteration && elapsed < HARD_CEILING_S) {
      requestAnimationFrame(update);
    } else {
      holdAndPulse();
    }
  }

  // Growth naturally finishes well before the final swell (~1.5s vs a
  // clip that runs to 4.324s). Rather than let the blob sit dead on
  // screen for the gap, this keeps redrawing the now-frozen shape with
  // a slow drift and the same beat-synced pulse, so it visibly "breathes"
  // along with the quieter parts of the loop until the final swell
  // triggers the morph into the logo.
  var frozenScale = null;

  function holdAndPulse(now) {
    if (frozenScale === null) frozenScale = 2000 / minDist;
    var elapsed = ((now || performance.now()) - growthStartTime) / 1000;
    var pulse = 1 + PULSE_STRENGTH * pulseEnvelope(elapsed);
    var drift = elapsed * 0.12; // slow, subtle rotation so the hold doesn't look frozen

    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(drift);
    ctx.scale(frozenScale * pulse, frozenScale * pulse);

    drawBlobPolygon();
    ctx.restore();

    if (elapsed < MORPH_START_TIME) {
      requestAnimationFrame(holdAndPulse);
    } else {
      startMorph();
    }
  }

  // ---------------------------------------------------------------
  // Morph phase
  //
  // Takes the organic blob the growth sim just built, resamples both
  // it and the logo's silhouette profile onto the same ring of angles
  // around a shared center, and eases the blob's radius-per-angle from
  // its current (organic) values to the logo's (circle + spikes)
  // values. The blob visibly reshapes into the logo's actual outline
  // before the crossfade reveals the full-color image underneath.
  // ---------------------------------------------------------------
  var LOGO_Y_OFFSET = -32; // keep in sync with #finalLogo's "top: calc(50% - 32px)"

  function startMorph() {
    if (!sticks.length) {
      finishTransition();
      return;
    }

    var start = sticks[0].a;
    var loop = [{ x: start.x, y: start.y }];
    var origin = start;
    while (origin.next && origin.next !== start) {
      origin = origin.next;
      loop.push({ x: origin.x, y: origin.y });
    }

    if (loop.length < 3) {
      finishTransition();
      return;
    }

    var cx = 0;
    var cy = 0;
    loop.forEach(function (p) {
      cx += p.x;
      cy += p.y;
    });
    cx /= loop.length;
    cy /= loop.length;

    var polar = loop
      .map(function (p) {
        var ang = Math.atan2(p.y - cy, p.x - cx);
        if (ang < 0) ang += Math.PI * 2; // normalize to [0, 2*PI) to match targetAngle's domain
        return {
          a: ang,
          r: Math.sqrt((p.x - cx) * (p.x - cx) + (p.y - cy) * (p.y - cy))
        };
      })
      .sort(function (a, b) {
        return a.a - b.a;
      });

    function sampleSourceRadius(targetAngle) {
      for (var i = 0; i < polar.length; i++) {
        var cur = polar[i];
        var nxt = polar[(i + 1) % polar.length];
        var a0 = cur.a;
        var a1 = i === polar.length - 1 ? nxt.a + Math.PI * 2 : nxt.a;
        var ta = targetAngle < a0 ? targetAngle + Math.PI * 2 : targetAngle;
        if (ta >= a0 && ta <= a1) {
          var t = a1 === a0 ? 0 : (ta - a0) / (a1 - a0);
          return cur.r + (nxt.r - cur.r) * t;
        }
      }
      return polar[0].r;
    }

    var N = (logoSilhouette && logoSilhouette.n) || SILHOUETTE_ANGLES;
    var sourceR = new Array(N);
    for (var i = 0; i < N; i++) {
      sourceR[i] = sampleSourceRadius((i / N) * Math.PI * 2);
    }

    var logoSizePx = Math.min(window.innerWidth * 0.78, 760);
    var scale = 2000 / minDist;
    var targetRadiusWorld = (logoSizePx * 0.5) / scale;

    var rawTarget = logoSilhouette ? logoSilhouette.r : sourceR;
    var meanRaw = 0;
    rawTarget.forEach(function (v) {
      meanRaw += v;
    });
    meanRaw = meanRaw / rawTarget.length || 1;

    var targetR = new Array(N);
    for (var j = 0; j < N; j++) {
      targetR[j] = (rawTarget[j] / meanRaw) * targetRadiusWorld;
    }

    var duration = 480; // MORPH_START_TIME (3.84s) + this ≈ 4.32s, matching the clip's natural end (4.324s)
    var startTime = null;

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function drawMorphFrame(now) {
      if (startTime === null) startTime = now;
      var t = Math.min((now - startTime) / duration, 1);
      var eased = easeInOutCubic(t);

      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(w / 2, h / 2 + LOGO_Y_OFFSET * eased);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#000";
      ctx.beginPath();
      for (var k = 0; k < N; k++) {
        var ang = (k / N) * Math.PI * 2;
        var rr = sourceR[k] + (targetR[k] - sourceR[k]) * eased;
        var px = Math.cos(ang) * rr;
        var py = Math.sin(ang) * rr;
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      if (t < 1) {
        requestAnimationFrame(drawMorphFrame);
      } else {
        finishTransition();
      }
    }

    requestAnimationFrame(drawMorphFrame);
  }

  // The visual sequence is now timed to land right on the clip's natural
  // end (MORPH_START_TIME + morph duration ≈ 4.32s, the clip is 4.324s),
  // so this is just a short fade to avoid an abrupt digital cutoff/click
  // rather than a hard early stop.
  function fadeOutAudio(audio, duration) {
    var startVolume = audio.volume;
    var start = null;
    function step(now) {
      if (start === null) start = now;
      var t = Math.min((now - start) / duration, 1);
      audio.volume = startVolume * (1 - t);
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        audio.pause();
        audio.currentTime = 0;
        audio.volume = startVolume;
      }
    }
    requestAnimationFrame(step);
  }

  function finishTransition() {
    var logo = document.getElementById("finalLogo");
    var flash = document.getElementById("flash");
    var label = document.querySelector(".hero-label");
    var backLink = document.querySelector(".back-link");
    var sound = document.getElementById("transformSound");

    flash.classList.add("hit");
    can.classList.add("done");

    logo.classList.add("show");
    label.classList.add("show");
    backLink.classList.add("show");

    fadeOutAudio(sound, 180);
  }
  document.getElementById("enterBtn").addEventListener("click", function (e) {
  e.preventDefault();

  var prompt = document.getElementById("enterPrompt");
  var btn = document.getElementById("enterBtn");
  var sound = document.getElementById("transformSound");

  btn.classList.add("btn--clicked");
  document.querySelectorAll(".color").forEach(function (el) {
    el.classList.add("expanded");
  });

  sound.currentTime = 0;
  sound.play().catch(function () {});

  growthStartTime = null;
  frozenScale = null;
  update();

  setTimeout(function () {
    prompt.classList.add("hide");
  }, 400);

  setTimeout(function () {
    btn.classList.remove("btn--clicked");
  }, 3500);

  setTimeout(function () {
    document.querySelectorAll(".color").forEach(function (el) {
      el.classList.remove("expanded");
    });
  }, 1700);
});
})();
</script>
